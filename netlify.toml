[build]
  command = "npm run build"
  publish = ".next"
  functions = ".next/functions"

[build.environment]
  NODE_VERSION = "18"  # Use Node.js 18 or higher

# For Next.js redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle 404 pages
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Enable CORS for assets
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"